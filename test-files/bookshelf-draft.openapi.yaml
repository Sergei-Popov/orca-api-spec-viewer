openapi: 3.1.0
info:
  title: Bookshelf API (draft)
  version: 2.5.0-draft
  summary: Shelves, books and reading lists for a small library.
  description: |
    The Bookshelf API keeps a library's **books**, **shelves** and **loans**.

    - Every list is paged with `cursor` and `limit`.
    - Times are [RFC 3339](https://www.rfc-editor.org/rfc/rfc3339) strings in UTC.
    - Errors use `application/problem+json`; see [Problem](#/components/schemas/Problem).

    This draft has a few mistakes on purpose, to show the problems panel.
  contact:
    name: Library platform team
    email: platform@library.example
    url: https://library.example/developers
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://{region}.library.example/v2
    description: Production
    variables:
      region:
        default: eu
        enum: [eu, us, ap]
        description: Data centre that holds the library.
  - url: http://localhost:8080/v2
    description: Local development
security:
  - oauth: [books.read]
tags:
  - name: books
    description: Books in the catalogue, with authors and editions.
  - name: shelves
    description: Named shelves that group books.
  - name: loans
    description: Who borrowed what, and when it is due back.
paths:
  /books:
    get:
      tags: [books]
      operationId: listBooks
      summary: List books
      description: Books in the catalogue, newest first. Filter by author, genre or shelf.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: author
          in: query
          description: Part of the author's name, any case.
          schema:
            type: string
            minLength: 2
          example: tolkien
        - name: genre
          in: query
          style: form
          explode: false
          description: One or more genres.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Genre'
        - name: Accept-Language
          in: header
          description: Language of titles and descriptions.
          schema:
            type: string
            default: en
      responses:
        '200':
          description: A page of books.
          headers:
            X-Total-Count:
              description: Books that match the filter.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [books]
      operationId: createBook
      summary: Add a book
      description: Adds a book to the catalogue. Printed books and e-books take different fields.
      security:
        - oauth: [books.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBook'
            examples:
              printed:
                summary: A printed book
                value:
                  kind: printed
                  title: The Hobbit
                  authors: [J. R. R. Tolkien]
                  isbn: 978-0-261-10221-7
                  pages: 310
                  genres: [fantasy]
              ebook:
                summary: An e-book
                value:
                  kind: ebook
                  title: Dune
                  authors: [Frank Herbert]
                  format: epub
                  sizeBytes: 1832000
                  genres: [science-fiction]
      responses:
        '201':
          description: The book was added.
          headers:
            Location:
              description: URL of the new book.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          links:
            GetBook:
              operationId: getBook
              parameters:
                bookId: $response.body#/id
              description: Read the book you just added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A book with this ISBN is already in the catalogue.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [books]
      operationId: getBook
      summary: Get a book
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [books]
      operationId: updateBook
      summary: Change a book
      description: Changes only the fields you send.
      security:
        - oauth: [books.write]
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              type: object
              properties:
                title:
                  type: string
                genres:
                  type: array
                  items:
                    $ref: '#/components/schemas/Genre'
                shelfId:
                  type: [string, 'null']
                  format: uuid
      responses:
        '200':
          description: The changed book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [books]
      operationId: deleteBook
      summary: Remove a book
      security:
        - oauth: [books.write]
      responses:
        '204':
          description: The book was removed.
        '404':
          $ref: '#/components/responses/NotFound'
  /shelves:
    get:
      tags: [shelves]
      operationId: listBooks
      summary: List shelves
      responses:
        '200':
          description: Every shelf.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shelf'
    post:
      tags: [shelves]
      operationId: createShelf
      summary: Create a shelf
      security:
        - oauth: [books.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Shelf'
      responses:
        '201':
          description: The new shelf.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelf'
  /shelves/{shelfId}/books:
    get:
      tags: [shelves]
      operationId: listShelfBooks
      summary: Books on a shelf
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
  /loans:
    post:
      tags: [loans]
      operationId: borrowBook
      summary: Borrow a book
      security:
        - oauth: [loans.write]
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Loan'
      callbacks:
        dueSoon:
          '{$request.body#/notifyUrl}':
            post:
              summary: The loan is due in two days
              requestBody:
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Loan'
              responses:
                '204':
                  description: Received.
      responses:
        '201':
          description: The loan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '409':
          description: Somebody else has the book.
  /loans/{loanId}/return:
    post:
      tags: [loans]
      operationId: returnBook
      summary: Return a book
      deprecated: true
      description: Use `PATCH /loans/{loanId}` with `returnedAt` instead.
      parameters:
        - name: loanId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: The book is back.
webhooks:
  bookAdded:
    post:
      summary: A book was added to the catalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Book'
      responses:
        '200':
          description: Received.
components:
  schemas:
    Genre:
      type: string
      enum: [fantasy, science-fiction, history, poetry, children]
    BookBase:
      type: object
      required: [title, authors]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
          examples: [The Hobbit]
        authors:
          type: array
          minItems: 1
          items:
            type: string
          examples: [[J. R. R. Tolkien]]
        genres:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Genre'
        published:
          type: string
          format: date
    PrintedBook:
      allOf:
        - $ref: '#/components/schemas/BookBase'
        - type: object
          required: [kind, isbn]
          properties:
            kind:
              const: printed
            isbn:
              type: string
              pattern: '^97[89]-[0-9-]{10,14}$'
            pages:
              type: integer
              minimum: 1
    EBook:
      allOf:
        - $ref: '#/components/schemas/BookBase'
        - type: object
          required: [kind, format]
          properties:
            kind:
              const: ebook
            format:
              type: string
              enum: [epub, pdf, mobi]
            sizeBytes:
              type: integer
              format: int64
    NewBook:
      oneOf:
        - $ref: '#/components/schemas/PrintedBook'
        - $ref: '#/components/schemas/EBook'
      discriminator:
        propertyName: kind
        mapping:
          printed: '#/components/schemas/PrintedBook'
          ebook: '#/components/schemas/EBook'
    Book:
      allOf:
        - $ref: '#/components/schemas/NewBook'
        - type: object
          required: [id, addedAt]
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            addedAt:
              type: string
              format: date-time
              readOnly: true
            shelf:
              $ref: '#/components/schemas/Shelf'
            series:
              $ref: '#/components/schemas/Series'
            related:
              type: array
              description: Books readers often borrow next.
              items:
                $ref: '#/components/schemas/Book'
    BookPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        next:
          type: [string, 'null']
          description: Cursor of the next page, or null on the last one.
    Shelf:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          examples: [Science fiction]
        location:
          type: string
          description: Room and bay, such as `B2-14`.
        tags:
          type: object
          additionalProperties:
            type: string
    Loan:
      type: object
      required: [bookId, reader]
      properties:
        id:
          type: string
          readOnly: true
        bookId:
          type: string
          format: uuid
        reader:
          type: string
          format: email
        due:
          type: string
          format: date
        notifyUrl:
          type: string
          format: uri
          writeOnly: true
    Review:
      type: object
      properties:
        stars:
          type: integer
          minimum: 1
          maximum: 5
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Where the page starts, from `next` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: fifty
  responses:
    BadRequest:
      description: The request is not valid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Nothing has this id.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    oauth:
      type: oauth2
      description: Sign in with a library account.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.library.example/authorize
          tokenUrl: https://auth.library.example/token
          scopes:
            books.read: Read the catalogue
            books.write: Change the catalogue
            loans.write: Borrow and return books
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Keys for self-service kiosks.
